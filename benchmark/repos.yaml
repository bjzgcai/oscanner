version: 1
name: oscanner-language-career-benchmark
status: draft
description: >
  Metadata-only benchmark draft for evaluating Oscanner across six programming
  language tracks and five career-stage levels per track.

languages:
  - id: python
    label: Python
    feature_requirements_file: benchmark/feature_requirements/python.yaml
  - id: javascript-typescript
    label: JavaScript/TypeScript
    feature_requirements_file: benchmark/feature_requirements/javascript-typescript.yaml
  - id: go
    label: Go
    feature_requirements_file: benchmark/feature_requirements/go.yaml
  - id: rust
    label: Rust
    feature_requirements_file: benchmark/feature_requirements/rust.yaml
  - id: java
    label: Java
    feature_requirements_file: benchmark/feature_requirements/java.yaml
  - id: cpp
    label: C/C++
    feature_requirements_file: benchmark/feature_requirements/cpp.yaml

levels:
  - id: L1
    label: Junior
    definition: >
      Early work with limited scope, small fixes, simple features, or learning
      stage contributions.
  - id: L2
    label: Independent
    definition: >
      Delivers complete features, handles common edge cases, and writes usable
      tests or documentation with limited architecture ownership.
  - id: L3
    label: Senior
    definition: >
      Owns meaningful modules, improves maintainability, makes design tradeoffs,
      and contributes reliable tests or reviewable changes.
  - id: L4
    label: Lead
    definition: >
      Leads architecture or quality gates, coordinates larger changes, and shows
      strong judgment around reliability, compatibility, and operations.
  - id: L5
    label: Expert
    definition: >
      Creates or shapes influential systems, sets ecosystem direction, and has
      public evidence of exceptional technical impact.

defaults:
  evaluator:
    plugin_id: zgc_ai_native_2026
    expected_score_band: null
    expected_strengths: []
    expected_risks: []
  repos_runner:
    test_command_policy: auto_detect
    feature_requirements_override: []
    known_test_constraints: []
  fairness:
    review_status: unreviewed
    public_evidence_urls: []
    exclusion_notes: []

