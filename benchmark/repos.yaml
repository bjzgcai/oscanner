      owner: mitsuhiko
      name: twitterlog
      url: https://github.com/mitsuhiko/twitterlog
      ref_type: sha
      ref: 88b23f68efbfcc6030e756278c8eb54c30d36bd2
      start_sha: null
      end_sha: null
      license: null
    selection_evidence:
      - Early small Python utility; useful as an immature personal-repo baseline.
    evaluator: &python_evaluator
      plugin_id: zgc_ai_native_2026
      target_author: mitsuhiko
      expected_score_band: null
      expected_strengths: []
      expected_risks:
        - Small historical repo may not expose enough context for stable scoring.
    repos_runner: &python_runner
      feature_requirements_file: benchmark/feature_requirements/python.yaml
      feature_requirements_override: []
      test_command_policy: auto_detect
      known_test_constraints:
        - Pinned to default-branch HEAD on 2026-05-25; update the SHA only through benchmark review.
    fairness: &public_candidate_fairness
      selection_rule: Prefer the strongest public non-fork repo or ref for the level; prefer personal repos when evidence is comparable, but allow organization repos when attribution is clear and the repo exposes stronger engineering signals.
